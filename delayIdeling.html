<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delay Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #5865f2;
      --accent2: #7289ff;
      --glow:    rgba(88,101,242,0.25);
      --text:    #dde1f0;
      --muted:   #4a5268;
      --border:  #252d42;
      --surface: rgba(15,18,25,0.6);
      --success: #3ba55d;
      --error:   #ed4245;
    }

    html, body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--text);
      font-family: 'Syne', 'Segoe UI', sans-serif;
    }

    .wrap {
      width: 100%;
      padding: 1rem;
      max-width: 420px;
    }

    /* ── Labels ── */
    .field { margin-bottom: 1.1rem; }
    .field-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .field-label::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    /* ── Inputs ── */
    input, textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-family: 'Syne', 'Segoe UI', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input[type="date"],
    input[type="time"] { font-family: 'JetBrains Mono', monospace; color-scheme: dark; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    input::placeholder, textarea::placeholder { color: var(--border); }
    textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

    /* Date + Time side by side */
    .datetime-row { display: flex; gap: 0.6rem; }
    .datetime-row .field { flex: 1; margin-bottom: 0; }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px var(--glow);
      margin-top: 1.2rem;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.loading { opacity: 0.6; pointer-events: none; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      box-shadow: none;
      margin-top: 0.6rem;
      font-size: 0.78rem;
    }
    .btn.secondary:hover { color: var(--text); border-color: var(--accent); }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast {
      display: none;
      margin-top: 0.8rem;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      align-items: center;
      gap: 0.5rem;
    }
    .toast.show { display: flex; }
    .toast.ok  { background: rgba(59,165,93,0.1);  border: 1px solid rgba(59,165,93,0.25);  color: var(--success); }
    .toast.err { background: rgba(237,66,69,0.08); border: 1px solid rgba(237,66,69,0.25);  color: var(--error); }

    /* ── User row ── */
    .user-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.1rem;
    }
    .user-row img {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .user-row .name { font-size: 0.85rem; font-weight: 700; }
    .user-row .uid  { font-size: 0.6rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .logout-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.65rem;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      transition: color 0.2s, border-color 0.2s;
    }
    .logout-btn:hover { color: var(--error); border-color: var(--error); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 1rem 0;
    }

    /* ── Notice ── */
    .notice {
      background: rgba(88,101,242,0.07);
      border: 1px solid rgba(88,101,242,0.2);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.1rem;
    }
    .notice strong { color: var(--accent2); }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Logga in -->
  <div id="loginCard">
    <button class="btn" onclick="loginWithDiscord()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Logga in med Discord
    </button>
  </div>

  <!-- Steg 3: Schemalägg meddelande -->
  <div id="msgCard" style="display:none">
    <div class="user-row">
      <img id="avatar" src="" alt=""/>
      <div>
        <div class="name" id="userTag"></div>
        <div class="uid" id="userId"></div>
      </div>
      <button class="logout-btn" onclick="logout()">Logga ut</button>
    </div>

    <div class="divider"></div>

    <div class="field">
      <div class="field-label">Meddelande</div>
      <textarea id="message" placeholder="Skriv ditt meddelande här…"></textarea>
    </div>

    <div class="datetime-row">
      <div class="field">
        <div class="field-label">Datum</div>
        <input type="date" id="sendDate"/>
      </div>
      <div class="field">
        <div class="field-label">Tid</div>
        <input type="time" id="sendTime"/>
      </div>
    </div>

    <button class="btn" id="sendBtn" onclick="sendMsg()">
      <span class="spinner" id="spinner"></span>
      <span id="btnLabel">Schemalägg meddelande</span>
    </button>

    <div class="toast" id="toast"></div>
  </div>

</div>

<script>
  var NODE_RED_URL = "https://delay.playit.plus/discord-send";
  var AUTH_URL     = "https://delay.playit.plus/discord-auth";
  var CLIENT_ID    = "1501874884655976599";
  var REDIRECT_URI = "https://swedecraft.com/delay";

  // Sätt dagens datum som default
  document.getElementById('sendDate').value = new Date().toISOString().split('T')[0];

  // Kolla sessionStorage vid start
  var savedUser = null;
  try { savedUser = JSON.parse(sessionStorage.getItem('discordUser')); } catch(e) {}
  if (savedUser) showMessageView(savedUser);

  // Ta emot OAuth-koden från delay.html via postMessage
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'discord_code') {
      document.getElementById('loginCard').innerHTML = '<p style="color:#4a5268;font-family:\'JetBrains Mono\',monospace;font-size:0.8rem;padding:0.5rem;">Loggar in…</p>';
      exchangeCode(e.data.code);
    }
  });

  // Signalera till föräldern att iframen är redo att ta emot koden
  window.parent.postMessage({ type: 'iframe_ready' }, '*');

  function loginWithDiscord() {
    // Navigera hela sidan till Discord — delay.html tar emot redirecten och skickar koden hit
    window.top.location.href = 'https://discord.com/oauth2/authorize'
      + '?client_id=' + CLIENT_ID
      + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
      + '&response_type=code'
      + '&scope=identify';
  }

  async function exchangeCode(code) {
    try {
      var res  = await fetch(AUTH_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ code: code, redirectUri: REDIRECT_URI })
      });
      var user = await res.json();
      if (user.id) {
        sessionStorage.setItem('discordUser', JSON.stringify(user));
        window.history.replaceState({}, document.title, window.location.pathname);
        showMessageView(user);
      } else {
        document.getElementById('loginCard').innerHTML = '<p style="color:#ed4245;font-size:0.85rem;padding:0.5rem;">Inloggning misslyckades. <a href="javascript:location.reload()" style="color:#5865f2">Försök igen</a></p>';
      }
    } catch(e) {
      document.getElementById('loginCard').innerHTML = '<p style="color:#ed4245;font-size:0.85rem;padding:0.5rem;">Kunde inte nå servern. <a href="javascript:location.reload()" style="color:#5865f2">Försök igen</a></p>';
    }
  }

  function showMessageView(user) {
    document.getElementById('loginCard').style.display  = 'none';
    document.getElementById('msgCard').style.display    = 'block';
    document.getElementById('userTag').textContent = user.username;
    document.getElementById('userId').textContent  = 'ID: ' + user.id;
    var avatarEl = document.getElementById('avatar');
    avatarEl.src = user.avatar
      ? 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png'
      : 'https://cdn.discordapp.com/embed/avatars/0.png';
  }

  function logout() {
    sessionStorage.removeItem('discordUser');
    window.location.reload();
  }

  async function sendMsg() {
    var user    = JSON.parse(sessionStorage.getItem('discordUser'));
    var message = document.getElementById('message').value.trim();
    var date    = document.getElementById('sendDate').value;
    var time    = document.getElementById('sendTime').value;
    var toast   = document.getElementById('toast');
    var btn     = document.getElementById('sendBtn');
    var spinner = document.getElementById('spinner');
    var label   = document.getElementById('btnLabel');

    toast.className = 'toast';

    if (!message || !date || !time) {
      toast.className = 'toast show err';
      toast.textContent = '⚠ Fyll i meddelande, datum och tid.';
      return;
    }

    // Räkna ut delay i ms från nu till valt datum+tid
    var target  = new Date(date + 'T' + time + ':00');
    var now     = new Date();
    if (target <= now) {
      toast.className = 'toast show err';
      toast.textContent = '⚠ Vald tid är redan passerad.';
      return;
    }

    btn.classList.add('loading');
    spinner.style.display = 'block';
    label.textContent = 'Skickar…';

    try {
      var res = await fetch(NODE_RED_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({
          userId:   user.id,
          message:  message,
          sendTime: time,
          sendDate: date
        })
      });

      if (res.ok) {
        toast.className = 'toast show ok';
        var diff = target - now;
        var h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
        toast.textContent = '✓ Schemalagt! Skickas om ' + (h ? h + 't ' : '') + m + 'min.';
        document.getElementById('message').value = '';
        document.getElementById('sendTime').value = '';
      } else {
        toast.className = 'toast show err';
        toast.textContent = '✗ Serverfel ' + res.status;
      }
    } catch(e) {
      toast.className = 'toast show err';
      toast.textContent = '✗ Kunde inte nå Node-RED — kör ngrok?';
    }

    btn.classList.remove('loading');
    spinner.style.display = 'none';
    label.textContent = 'Schemalägg meddelande';
  }
</script>
</body>
</html>
